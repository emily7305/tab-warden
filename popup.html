<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab Warden</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --line: #d8dee4;
    --surface: #f6f8fa;
    --accent: #2f6feb;
    --warn: #b4410c;
    --warn-bg: #fff1e6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --fg: #e6e8eb;
      --muted: #9198a1;
      --line: #2d333b;
      --surface: #1f2329;
      --accent: #4c8dff;
      --warn: #fb923c;
      --warn-bg: #3a2314;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 380px;
    max-height: 580px;
    overflow-y: auto;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }

  section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }

  section:last-of-type { border-bottom: 0; }

  h2 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hint {
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }

  .list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #tab-list {
    max-height: 220px;
    overflow-y: auto;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
  }

  .row + .row,
  .vault + .vault { border-top: 1px solid var(--line); }

  .favicon {
    flex: none;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background: var(--surface);
  }

  .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .state {
    flex: none;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .row.hibernated .title { color: var(--muted); }

  button {
    flex: none;
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  button:hover:not(:disabled) { border-color: var(--accent); }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  button.primary {
    width: 100%;
    padding: 7px 12px;
    border-color: var(--accent);
    background: var(--accent);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
  }

  button.primary:hover:not(:disabled) { filter: brightness(1.08); }

  .note {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .status {
    margin: 8px 0 0;
    font-size: 12px;
  }

  .status:empty { display: none; }

  .status.error { color: var(--warn); }

  .vault { padding: 8px 0; }

  .vault-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .vault-meta {
    flex: 1;
    min-width: 0;
  }

  .vault-count { color: var(--muted); }

  .vault-preview {
    margin-top: 2px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <h1>Tab Warden</h1>
  </header>

  <section>
    <h2><span>Tabs</span><span id="tab-summary" class="hint"></span></h2>
    <ul id="tab-list" class="list"></ul>
    <p id="tab-status" class="status" role="status"></p>
  </section>

  <section>
    <h2>Freeze Session</h2>
    <p class="note">Saves the tabs in this window to a vault, then closes them.</p>
    <button id="freeze" class="primary" type="button">Freeze Session</button>
    <p id="freeze-status" class="status" role="status"></p>
  </section>

  <section>
    <h2>Frozen Vaults</h2>
    <p id="vaults-empty" class="note" hidden>No frozen sessions yet.</p>
    <ul id="vault-list" class="list"></ul>
    <p id="vault-status" class="status" role="status"></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
